name: Validate iOS client

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"
    paths:
      - "ios/**"
      - "config/lunatv-config.json"
      - "config/lunatv-catalog-fallback.json"
      - ".github/workflows/ios-validate.yml"

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project LunaTViOS.xcodeproj
          -scheme LunaTV
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit tests
        working-directory: ios
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"].values(); print(next(device["udid"] for runtime in devices for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          xcodebuild \
            -project LunaTViOS.xcodeproj \
            -scheme LunaTV \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build unsigned IPA for personal signing
        working-directory: ios
        run: |
          xcodebuild \
            -project LunaTViOS.xcodeproj \
            -scheme LunaTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/LunaTV.app Payload/
          test -f Payload/LunaTV.app/lunatv-config.json
          test -f Payload/LunaTV.app/Assets.car
          find Payload/LunaTV.app -type f -name '*.m3u' -print -quit | grep -q .
          test -f Payload/LunaTV.app/lunatv-catalog-fallback.json
          /usr/bin/zip -qry LunaTV-iOS-3.0.2.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: LunaTV-iOS-3.0.2
          path: ios/LunaTV-iOS-3.0.2.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned IPA for the scan page
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          ios/LunaTV-iOS-3.0.2.ipa
          --title "LunaTV iPhone 3.0.2"
          --notes "片库展示升级：各地区剧集按首播年份优先；年份成为独立筛选条件；国漫保留全部内容并将常规动画置于短剧之前；共享目录继续使用 Pages、家庭局域网与 Worker 三路容错。"
