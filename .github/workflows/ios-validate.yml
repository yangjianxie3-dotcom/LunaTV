name: Validate iOS client

on:
  workflow_dispatch:
  push:
    branches:
      - "candidate/ios-*"
    tags:
      - "ios-v*"
    paths:
      - "ios/**"
      - "config/lunatv-config.json"
      - "config/lunatv-catalog-fallback.json"
      - ".github/workflows/ios-validate.yml"

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project LunaTViOS.xcodeproj
          -scheme LunaTV
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit tests
        working-directory: ios
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"].values(); print(next(device["udid"] for runtime in devices for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          xcodebuild \
            -project LunaTViOS.xcodeproj \
            -scheme LunaTV \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build unsigned IPA for personal signing
        id: package
        working-directory: ios
        run: |
          xcodebuild \
            -project LunaTViOS.xcodeproj \
            -scheme LunaTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/LunaTV.app Payload/
          test -f Payload/LunaTV.app/lunatv-config.json
          test -f Payload/LunaTV.app/Assets.car
          find Payload/LunaTV.app -type f -name '*.m3u' -print -quit | grep -q .
          test -f Payload/LunaTV.app/lunatv-catalog-fallback.json
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/LunaTV.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Payload/LunaTV.app/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          /usr/bin/zip -qry "LunaTV-iOS-$VERSION.ipa" Payload
          shasum -a 256 "LunaTV-iOS-$VERSION.ipa" > "LunaTV-iOS-$VERSION.ipa.sha256"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: LunaTV-iOS-${{ steps.package.outputs.version }}-build${{ steps.package.outputs.build }}-candidate
          path: |
            ios/LunaTV-iOS-*.ipa
            ios/LunaTV-iOS-*.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned IPA for the scan page
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "ios/LunaTV-iOS-${{ steps.package.outputs.version }}.ipa"
          --title "LunaTV iPhone ${{ steps.package.outputs.version }}"
          --notes "iPhone 原生版；安装需要用户正常签名。具体功能、实测记录及验收边界请查阅对应版本报告。"
